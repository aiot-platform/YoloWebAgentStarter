services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    environment:
      YWA_DATA_DIR: /data
      YWA_IMPORT_ROOT: /data/imports
      YWA_HOST: 0.0.0.0
      YWA_PORT: 8000
      YWA_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ""
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
